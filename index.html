<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitali Kazakevich — Apps</title>
<meta name="description" content="Apps by Vitali Kazakevich: support and privacy pages.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --accent: #b8322a; --rule: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --fg: #f2f2f7; --muted: #a1a1a6; --accent: #ff7a6b; --rule: #2c2c2e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 700px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-size: 34px; line-height: 1.15; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { margin: 0 0 12px; color: var(--muted); }
  ul { list-style: none; margin: 32px 0 0; padding: 0; border-top: 1px solid var(--rule); }
  li { padding: 16px 0; border-bottom: 1px solid var(--rule); }
  li strong { display: block; font-size: 19px; }
  a { color: var(--accent); text-underline-offset: 2px; margin-right: 20px; }
</style>
</head>
<body>
<main>
  <h1>Apps by Vitali Kazakevich</h1>
  <p>Support and privacy information for my apps.</p>
  <ul>
    <li>
      <strong>Japanese: learning</strong>
      <a href="japanese-learning/">Support</a>
      <a href="japanese-learning/privacy.html">Privacy Policy</a>
    </li>
  </ul>
</main>
</body>
</html>
